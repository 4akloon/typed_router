name: typed_navigator
description: >-
  Statically typed, tree-based navigation for Flutter on Navigator 2.0.
  Routes are Dart values; URLs are an optional adapter.
version: 0.0.1
publish_to: none

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.1.0
