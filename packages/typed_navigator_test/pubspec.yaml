name: typed_navigator_test
description: >-
  Widget test utilities for apps on typed_navigator: the Android back
  button, the predictive back gesture, the iOS back swipe and what the app
  told the platform.
version: 0.8.0
repository: https://github.com/4akloon/typed_navigator
homepage: https://github.com/4akloon/typed_navigator
issue_tracker: https://github.com/4akloon/typed_navigator/issues
documentation: https://github.com/4akloon/typed_navigator/tree/main/packages/typed_navigator_test
topics:
  - navigation
  - testing
  - router
resolution: workspace

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter
  # Already pinned by the Flutter SDK; used for `@internal`.
  meta: ^1.15.0

dev_dependencies:
  cupertino_ui: ^1.0.0
  material_ui: ^1.0.1
