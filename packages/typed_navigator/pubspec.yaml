name: typed_navigator
description: >-
  Statically typed, tree-based navigation for Flutter on Navigator 2.0:
  routes are Dart values, with typed results, redirects, shells and tabs.
version: 0.8.0
repository: https://github.com/4akloon/typed_navigator
homepage: https://github.com/4akloon/typed_navigator
issue_tracker: https://github.com/4akloon/typed_navigator/issues
documentation: https://github.com/4akloon/typed_navigator/tree/main/packages/typed_navigator/doc
topics:
  - navigation
  - router
  - routing
  - go-router
resolution: workspace

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  # Already pinned by the Flutter SDK; used for `@internal`.
  meta: ^1.15.0

# Design systems only for the tests' own page factories: the library imports
# none.
dev_dependencies:
  cupertino_ui: ^1.0.0
  flutter_test:
    sdk: flutter
  material_ui: ^1.0.1
  typed_navigator_test: ^0.8.0
